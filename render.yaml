# Despliegue en Render (plan gratis). Se usa como «Blueprint»: ver la sección «Despliegue» del README.
# La base de datos vive aparte, en Neon (ADR-002).
services:
  - type: web
    name: rescate-alimentos
    runtime: node
    plan: free
    buildCommand: npm ci
    # Cada arranque aplica las migraciones pendientes y, si no hay ninguna coordinadora activa, crea la primera con
    # las variables de abajo. La semilla de demostración NO se carga en producción: sus PIN son públicos (T-ADM.3).
    startCommand: npm run db:migrar && npm run db:primera-coordinadora && npm start
    healthCheckPath: /salud
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Bogota
      # La cadena de conexión de Neon la pegas tú en la página de Render; nunca va en el repositorio.
      - key: DATABASE_URL
        sync: false
      # Render la genera sola: no hay que inventarla ni verla.
      - key: SESSION_SECRET
        generateValue: true
      # Nombre y PIN (4 números) de la primera coordinadora. Los escribes tú en Render; solo se usan si no hay
      # ninguna coordinadora activa, y esa persona debe cambiar el PIN al entrar.
      - key: PRIMERA_COORDINADORA_NOMBRE
        sync: false
      - key: PRIMERA_COORDINADORA_PIN
        sync: false
