  <path d="M70 100l-6 14M92 96l-6 16M112 102l-6 14" stroke="#c97a14" stroke-width="5" stroke-linecap="round" fill="none"/>

  <path d="M205 68l24 20-64 66z" fill="#e8741c"/>
  <path d="M205 68c2-18 10-26 20-30M205 68c-8-14-8-24-4-32M205 68c10-4 22-2 30 6" stroke="#2a9d5c" stroke-width="7" stroke-linecap="round" fill="none"/>

  <path d="M122 46h42l7 20v54h-56V66z" fill="#ffffff" stroke="#17352b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M115 66h56" stroke="#c9d6cf" stroke-width="5"/>
  <rect x="129" y="84" width="28" height="18" rx="4" fill="#1f7a45"/>

  <path d="M234 118c-9-12-34-7-34 17 0 20 14 34 34 34s34-14 34-34c0-24-25-29-34-17z" fill="#c23a52"/>
