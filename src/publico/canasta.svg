<!-- Ilustración de la canasta de rescate: pan, leche, zanahoria y manzana. El color de la canasta
     funciona tanto sobre el fondo oscuro de la portada como sobre el fondo claro del ingreso. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" role="img" aria-label="Canasta con alimentos">
  <!-- Alimentos (van detrás de la canasta, que tapa sus bases) -->
