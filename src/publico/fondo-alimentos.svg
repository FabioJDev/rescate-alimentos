<?xml version="1.0" encoding="UTF-8"?>
<!-- Patrón de fondo de la aplicación: alimentos y corazones dibujados con una sola línea, muy suave
     para que el texto se lea sin esfuerzo. Se repite sin costuras cada 240 px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#1f7a45" opacity="0.1">
      <!-- manzana -->
      <g transform="translate(22 18) rotate(-12) scale(1.5)">
        <path d="M12 7c-2-2-6-1-6 4 0 4 3 9 6 9s6-5 6-9c0-5-4-6-6-4z"/>
        <path d="M12 7c0-2 1-4 3-4"/>
      </g>
      <!-- pan -->
      <g transform="translate(138 22) rotate(8) scale(1.5)">
        <path d="M4 13c0-4 3-7 8-7s8 3 8 7v5H4z"/>
        <path d="M9 10l-1 3M13 9.5l-1 3M17 10l-1 3"/>
      </g>
      <!-- leche -->
      <g transform="translate(88 104) rotate(-6) scale(1.5)">
        <path d="M7 3h10l1 4v14H6V7z"/>
        <path d="M6 7h12M10 13h4"/>
      </g>
      <!-- zanahoria -->
      <g transform="translate(184 118) rotate(22) scale(1.5)">
        <path d="M14 8l4 4-12 9z"/>
        <path d="M15 6l2-3M17 8l3-1M13 5l0-3"/>
      </g>
      <!-- hoja -->
      <g transform="translate(18 130) rotate(10) scale(1.5)">
        <path d="M5 19C5 9 11 5 20 4c0 9-4 15-13 15z"/>
        <path d="M5 19l9-9"/>
      </g>
      <!-- manzana pequeña -->
      <g transform="translate(150 190) rotate(14) scale(1.2)">
        <path d="M12 7c-2-2-6-1-6 4 0 4 3 9 6 9s6-5 6-9c0-5-4-6-6-4z"/>
        <path d="M12 7c0-2 1-4 3-4"/>
      </g>
    </g>
    <!-- corazones: la solidaridad, en el color cálido de la marca -->
    <g stroke="#f29a2e" opacity="0.28">
      <g transform="translate(100 24) rotate(-8) scale(1.1)">
        <path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>
      </g>
      <g transform="translate(30 204) rotate(10) scale(0.9)">
        <path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>
      </g>
      <g transform="translate(208 62) rotate(12) scale(0.8)">
        <path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>
      </g>
    </g>
  </g>
</svg>
